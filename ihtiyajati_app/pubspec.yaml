name: ihtiyajati_app
description: "تطبيق احتياجاتي - منظومة التوصيل الشامل في كربلاء المقدسة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  flutter_animate: ^4.5.2
  badges: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.0+3
  flutter_slidable: ^3.1.1
  percent_indicator: ^4.2.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
